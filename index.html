<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>しんしのおしたく</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Hiragino Maru Gothic Pro', 'BIZ UDPGothic', sans-serif; background: #1a2a1a; -webkit-font-smoothing: antialiased; }
    .screen { display: none; width: 100%; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
    .screen.active { display: flex; flex-direction: column; }

    /* MAP */
    /* Phaserキャンバスを「残りの高さ」にぴったり収めるため、この画面だけ高さ固定。
       min-heightのままだとDOM（おねがいカード等）が増えたときに画面が縦に伸びて
       キャンバスの下側が画面外にはみ出す。 */
    #screen-map { background: #87CEEB; height: 100vh; height: 100dvh; max-height: 100dvh; overflow: hidden; }
    .map-topbar { background: rgba(0,0,0,.32); backdrop-filter: blur(8px); padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .tb-info { flex: 1 1 0; min-width: 0; }
    .tb-car { font-size: 20px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display:flex; align-items:center; gap:8px; min-width:0; }
    .tb-car-icon { width:42px; height:32px; flex:0 0 auto; display:block; }
    .tb-car-icon svg { width:100%; height:100%; display:block; }
    .tb-pts { font-size: 14px; color: rgba(255,255,255,.65); margin-top: 3px; }
    .tb-garage { position: relative; width: 58px; height: 50px; background: rgba(255,255,255,.24); border: none; border-radius: 13px; padding: 5px; cursor: pointer; font-family: inherit; flex: 0 0 auto; overflow: hidden; display:flex; align-items:center; justify-content:center; }
    .tb-garage svg { width:44px; height:40px; display:block; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
    .map-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .map-content { position: relative; width: 100%; }
    .hidden { display:none !important; }
    .map-svg { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index:2; }
    .map-content.event-active .map-svg,
    .map-content.event-active .map-node,
    .map-content.event-active .node-label,
    .map-content.event-active .node-track,
    .map-content.event-active .preview-marker,
    .map-content.event-active .map-place,
    .map-content.event-active .map-building,
    .map-content.event-active .town-issue,
    .map-content.event-active .player { opacity:.42; }
    .map-content.event-active .event-marker { opacity:1; }
    .map-content.event-active .map-node,
    .map-content.event-active .preview-marker,
    .map-content.event-active .map-place,
    .map-content.event-active .map-building,
    .map-content.event-active .town-issue {
      pointer-events: none;
      cursor: default;
    }
    .scenery-svg { position:absolute; inset:0 0 auto 0; width:100%; pointer-events:none; z-index:1; }
    .world-bg { position: absolute; left: 0; right: 0; }
    .world-banner { position: absolute; z-index:8; left: 8px; right: 8px; background: rgba(0,0,0,.38); backdrop-filter: blur(4px); border-radius: 14px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
    .wb-icon { width:28px; height:28px; display:block; flex:0 0 auto; }
    .wb-icon svg { width:100%; height:100%; display:block; }
    .wb-e { font-size: 24px; }
    .wb-n { font-size: 16px; font-weight: bold; color: #fff; }
    .wb-p { font-size: 14px; color: rgba(255,255,255,.55); margin-left: auto; }
    .map-node { position: absolute; display: flex; align-items: center; justify-content: center; padding: 0; font-size: 42px; cursor: pointer; z-index: 6; transition: transform .12s; overflow: visible; background: transparent; border: 0; box-shadow: none; }
    .map-node:active { transform: scale(.88); }
    .map-node svg { filter: drop-shadow(0 4px 5px rgba(0,0,0,.25)); }
    .map-node.completed svg { filter: drop-shadow(0 4px 5px rgba(0,0,0,.25)); }
    .map-node.current svg { filter: drop-shadow(0 0 7px rgba(255,214,78,.95)) drop-shadow(0 5px 6px rgba(0,0,0,.3)); animation: carPulse 1.6s ease-in-out infinite; }
    @keyframes carPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    .map-node.fog-near, .map-node.fog-far, .map-node.fog-hidden { background: transparent; border: 0; box-shadow: none; filter: none; }
    .map-node.fog-near svg { opacity:.55; filter:grayscale(.25) drop-shadow(0 3px 4px rgba(0,0,0,.18)); }
    .map-node.fog-far svg { opacity:.28; filter:grayscale(.45) drop-shadow(0 2px 3px rgba(0,0,0,.14)); }
    .map-node.fog-hidden { pointer-events:none; }
    .node-fog { display:none; }
    .node-trophy { position: absolute; top: -10px; right: -10px; font-size: 20px; z-index: 9; pointer-events: none; }
    .node-label  { position: absolute; z-index: 8; font-size: 13px; font-weight: bold; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.55),0 0 5px rgba(0,0,0,.55); white-space: nowrap; pointer-events: none; text-align: center; background:rgba(47,58,61,.48); border-radius:7px; padding:1px 5px; }
    .node-track  { position: absolute; z-index: 8; height: 8px; background: rgba(255,255,255,.3); border-radius: 4px; overflow: hidden; }
    .node-fill   { height: 100%; background: #FF6B35; border-radius: 4px; transition: width .5s; }
    .map-place { position:absolute; z-index:3; width:70px; height:70px; padding:4px; border-radius:0; background:transparent; border:0; box-shadow:none; pointer-events:none; }
    .map-place-title { display:flex; align-items:center; justify-content:center; }
    .map-place-title span { display:none; }
    .map-place-icon { width:62px; height:62px; flex:0 0 auto; filter:drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
    .map-place-icon svg { width:100%; height:100%; display:block; }
    .map-place-note { display:none; }
    .scenery-item { position:absolute; z-index:2; pointer-events:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.16)); }
    .tree { width:36px; height:46px; }
    .tree::before { content:''; position:absolute; left:3px; top:0; width:30px; height:32px; border-radius:50% 50% 45% 45%; background:#4F9F52; border:2px solid #2F6F36; box-shadow:8px 6px 0 -5px #67B765,-7px 8px 0 -6px #3F8E48; }
    .tree::after { content:''; position:absolute; left:14px; top:29px; width:9px; height:17px; border-radius:4px; background:#8B5A2B; }
    .flower { width:18px; height:18px; border-radius:50%; background:#FFE66D; border:2px solid #5F9E55; box-shadow:8px 1px 0 -4px #FF7A9A,-7px 2px 0 -4px #FF7A9A,1px 8px 0 -4px #FF7A9A; }
    .cone { width:20px; height:22px; background:linear-gradient(to bottom,#FFB74D 0 25%,#fff 25% 38%,#FF7A5C 38% 100%); clip-path:polygon(50% 0,95% 100%,5% 100%); }
    .player { position: absolute; width: 44px; height: 52px; z-index: 75; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.28)); }
    .player svg { width: 100%; height: 100%; display: block; }

    /* Event markers */
    .event-marker  { position: absolute; z-index: 80; cursor: pointer; text-align: center; transform: translateX(-50%); width:112px; min-height:112px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .event-marker::before { content:''; position:absolute; left:50%; top:50%; width:96px; height:96px; border:6px solid #FFE66D; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 8px rgba(255,230,109,.22),0 0 22px rgba(255,230,109,.9); animation:eventRing 1s ease-in-out infinite; pointer-events:none; }
    .event-marker .event-svg-wrap { position:relative; z-index:2; animation:eventFloat .9s ease-in-out infinite; filter:drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
    .event-emoji   { font-size: 58px; display: block; animation: firePulse .5s ease-in-out infinite; line-height: 1; }
    .event-hint    { position:relative; z-index:2; font-size: 16px; font-weight: bold; color: #283238; text-shadow: none; margin-top: 4px; white-space: nowrap; background: #FFE66D; border: 3px solid #fff; border-radius: 999px; padding: 3px 12px; display: inline-flex; align-items:center; gap:4px; box-shadow:0 3px 8px rgba(0,0,0,.2); }
    @keyframes eventRing { 0%,100%{transform:translate(-50%,-50%) scale(.92);opacity:.85} 50%{transform:translate(-50%,-50%) scale(1.15);opacity:.35} }
    @keyframes eventFloat { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-8px) scale(1.08)} }
    .event-guide-card { display:none; margin-top:12px; background:#FFF7CC; color:#263238; border:4px solid #FFE66D; border-radius:18px; padding:12px 14px; align-items:center; gap:12px; box-shadow:0 4px 14px rgba(0,0,0,.18); }
    .event-guide-card.show { display:flex; }
    .event-guide-icon { width:52px; height:52px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; animation:eventFloat .9s ease-in-out infinite; }
    .event-guide-icon svg { width:100%; height:100%; display:block; }
    .event-guide-copy { min-width:0; }
    .event-guide-title { font-size:18px; font-weight:bold; line-height:1.25; }
    .event-guide-body { font-size:14px; font-weight:bold; color:#5C5142; margin-top:2px; }
    .event-step-target { pointer-events:auto !important; cursor:pointer; }
    .event-step-target::before { content:''; position:absolute; left:50%; top:50%; width:calc(100% + 22px); height:calc(100% + 22px); border:5px solid #FFE66D; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 7px rgba(255,230,109,.25),0 0 20px rgba(255,230,109,.9); animation:eventRing .9s ease-in-out infinite; pointer-events:none; }
    .event-step-target .event-anim-svg, .event-step-target svg { position:relative; z-index:2; }
    .event-step-dim { opacity:.28 !important; filter:grayscale(.4); }
    .event-step-num { position:absolute; right:-10px; bottom:-10px; z-index:3; width:24px; height:24px; border-radius:50%; background:#FFE66D; border:3px solid #fff; color:#263238; font-size:14px; font-weight:bold; line-height:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 7px rgba(0,0,0,.25); pointer-events:none; }
    .trace-zone { position:absolute; z-index:91; border:6px dashed #FF3B30; border-radius:28px; background:rgba(255,59,48,.16); box-shadow:0 0 0 8px rgba(255,59,48,.18),0 0 24px rgba(255,59,48,.75); touch-action:none; }
    .trace-fill { position:absolute; left:8px; right:8px; bottom:8px; height:12px; border-radius:8px; background:rgba(255,255,255,.55); overflow:hidden; }
    .trace-fill span { display:block; height:100%; width:0%; background:#74B86F; border-radius:8px; transition:width .12s; }
    .drop-zone { position:absolute; z-index:90; border:6px dashed #FF3B30; border-radius:18px; background:rgba(255,59,48,.18); box-shadow:0 0 0 8px rgba(255,59,48,.18),0 0 24px rgba(255,59,48,.75); }
    .drag-piece { touch-action:none; pointer-events:auto !important; cursor:grab; }
    .drag-piece:active { cursor:grabbing; }
    .gesture-hint { position:absolute; z-index:98; left:0; top:0; width:0; height:0; pointer-events:none; }
    .gesture-hand { position:absolute; left:0; top:0; width:42px; height:42px; transform:translate(-21px,-21px); filter:drop-shadow(0 3px 5px rgba(0,0,0,.3)); animation:gestureDrag 1.45s ease-in-out infinite; }
    .gesture-hand svg { width:100%; height:100%; display:block; }
    .gesture-line { position:absolute; left:0; top:0; height:6px; width:var(--dist,100px); border-radius:999px; background:repeating-linear-gradient(90deg,#FF3B30 0 12px,rgba(255,255,255,.9) 12px 20px); transform-origin:left center; transform:rotate(var(--angle,0deg)); box-shadow:0 0 10px rgba(255,59,48,.55); opacity:.9; }
    .gesture-label { position:absolute; left:var(--label-x,0px); top:var(--label-y,0px); transform:translate(-50%,-50%); background:#FF3B30; color:#fff; border:4px solid #fff; border-radius:999px; padding:4px 12px; font-size:17px; font-weight:bold; white-space:nowrap; box-shadow:0 4px 12px rgba(0,0,0,.24); }
    .gesture-trace .gesture-hand { animation:gestureTrace 1.1s ease-in-out infinite; }
    @keyframes gestureDrag { 0%,15%{transform:translate(-21px,-21px) scale(1)} 65%,82%{transform:translate(calc(var(--dx,80px) - 21px),calc(var(--dy,0px) - 21px)) scale(1.08)} 100%{transform:translate(-21px,-21px) scale(1)} }
    @keyframes gestureTrace { 0%,100%{transform:translate(-62px,-21px) scale(1)} 50%{transform:translate(20px,-21px) scale(1.08)} }
    .sound-unlock { display:none; width:100%; border:0; border-radius:18px; margin:0 0 10px; padding:12px 14px; background:#FFF7CC; color:#263238; font-family:inherit; font-size:18px; font-weight:bold; box-shadow:0 3px 12px rgba(0,0,0,.16); }
    .sound-unlock.show { display:block; }
    .preview-marker { position: absolute; z-index: 9; cursor: pointer; text-align: center; transform: translateX(-50%); }
    .preview-marker:active { transform: translateX(-50%) scale(.92); }
    .preview-emoji  { font-size: 46px; display: block; filter: grayscale(.2); }
    .preview-lock   { width: 18px; height: 18px; display: block; margin: -4px auto 0; opacity: .82; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
    .preview-lock svg { width: 100%; height: 100%; display: block; }
    .preview-hint   { display: none; }
    @keyframes firePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

    /* Event animation keyframes */
    @keyframes waterDrop  { 0%{opacity:1;transform:scale(.4)} 60%{opacity:1;transform:scale(1.1)} 100%{opacity:0;transform:scale(.7) translateY(6px)} }
    @keyframes thiefRun   { 0%,100%{transform:translateX(-5px) scaleX(1)} 50%{transform:translateX(5px) scaleX(-1)} }
    @keyframes policeFlash{ 0%,100%{background:rgba(0,30,255,.35);box-shadow:0 0 30px rgba(0,30,255,.5)} 50%{background:rgba(255,0,0,.35);box-shadow:0 0 30px rgba(255,0,0,.5)} }
    @keyframes healBeat   { 0%{opacity:1;transform:scale(.5) translateY(0)} 50%{opacity:1;transform:scale(1.3) translateY(-12px)} 100%{opacity:0;transform:scale(.8) translateY(-20px)} }
    @keyframes fadeScale  { 0%{opacity:0;transform:scale(.5)} 40%{opacity:1;transform:scale(1.3)} 100%{opacity:0;transform:scale(1)} }
    @keyframes slideInRight { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }
    @keyframes popIn      { 0%{opacity:0;transform:scale(0)} 70%{transform:scale(1.3)} 100%{opacity:1;transform:scale(1)} }
    @keyframes splashOut  { 0%{opacity:1;transform:scale(.4)} 100%{opacity:0;transform:scale(1.8)} }
    @keyframes puffPop    { 0%{opacity:0;transform:translate(-50%,-50%) scale(.5)} 30%{opacity:1} 100%{opacity:0;transform:translate(-50%,-75%) scale(1.4)} }
    @keyframes workCarArrive { 0%{opacity:0;transform:translateX(90px) scale(.8)} 20%{opacity:1} 100%{opacity:1;transform:translateX(0) scale(1)} }
    @keyframes buildingReveal { 0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-4deg)} 38%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(2deg)} 70%{transform:translate(-50%,-50%) scale(.94) rotate(0)} 100%{opacity:1;transform:translate(-50%,-50%) scale(1)} }
    @keyframes happyBounce { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-12px) scale(1.08)} }

    /* HERO BUTTON */
    .map-hero { background: rgba(0,0,0,.28); backdrop-filter: blur(8px); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); flex-shrink: 0; }
    .hero-btn { width: 100%; border: none; border-radius: 24px; font-family: inherit; font-weight: bold; cursor: pointer; font-size: 28px; padding: 24px 20px; letter-spacing: .02em; transition: background .3s, transform .08s; }
    .hero-btn .btn-icon { width:36px; height:36px; display:inline-block; vertical-align:-8px; margin-right:8px; }
    .hero-btn .btn-icon svg { width:100%; height:100%; display:block; }
    .hero-btn:active  { transform: scale(.97); }
    .hero-btn.orange  { background: #FF6B35; color: #fff; box-shadow: 0 6px 22px rgba(255,107,53,.55); }
    .hero-btn.red     { background: #E53935; color: #fff; box-shadow: 0 6px 22px rgba(229,57,53,.55); animation: heroRedPulse 1s ease-in-out infinite; }
    @keyframes heroRedPulse { 0%,100%{box-shadow:0 6px 22px rgba(229,57,53,.55)} 50%{box-shadow:0 6px 32px rgba(229,57,53,.85)} }
    .hero-btn.done    { background: rgba(255,255,255,.22); color: rgba(255,255,255,.65); font-size: 22px; pointer-events: none; }

    /* Popup */
    .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
    .popup-overlay.hidden { display: none; }
    .popup-box { background: #1F2937; border-radius: 24px; padding: 28px 24px; text-align: center; width: 100%; max-width: 340px; }
    .popup-obstacle { font-size: 72px; margin-bottom: 8px; }
    .popup-title    { font-size: 20px; font-weight: bold; color: #FFE66D; margin-bottom: 10px; line-height: 1.4; }
    .popup-body     { font-size: 15px; color: rgba(255,255,255,.7); line-height: 1.6; margin-bottom: 22px; }
    .popup-progress { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
    .popup-dot      { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.2); }
    .popup-dot.on   { background: #FF6B35; border-color: #FF6B35; }
    .popup-dot.bonus{ background: #FFD700; border-color: #FFD700; }

    /* GARAGE */
    #screen-garage { background: #EAF6FF; color: #263238; }
    .gar-head  { background: #6FA8C6; padding: 18px 16px 14px; text-align: center; color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .gar-title { font-size: 26px; font-weight: bold; color: #fff; }
    .gar-sub   { font-size: 15px; color: rgba(255,255,255,.78); margin-top: 5px; }
    .gar-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 16px 4px; background:#D9EFFB; }
    .gar-actions .btn { margin:0; border-radius:16px; font-size:15px; padding:13px 10px; box-shadow:none; }
    .gar-actions .btn-ghost { background:#fff; color:#4D7080; }
    .gar-actions .btn-ghostw { background:#5F87A1; color:#fff; }
    .gar-tabs { display: flex; gap: 8px; padding: 12px 16px 0; background: #D9EFFB; }
    .gar-tab { flex: 1; border: none; border-radius: 14px 14px 0 0; padding: 13px 6px; font-family: inherit; font-size: 15px; font-weight: bold; background: rgba(255,255,255,.45); color: #4D7080; cursor: pointer; }
    .gar-tab.active { background: #EAF6FF; color: #2F3A3D; box-shadow: 0 -2px 6px rgba(95,135,161,.18); }
    .zukan-sil svg { filter: brightness(0) opacity(.28); }
    .gar-cell .hearts { font-size: 11px; margin-top: 2px; letter-spacing: 1px; }
    .zukan-meter { grid-column: 1/-1; text-align: center; font-size: 13px; font-weight: bold; color: #5F87A1; padding: 2px 0 4px; }
    .gar-grid  { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; padding: 14px 16px 16px; flex: 1; overflow-y: auto; align-content: start; background:#EAF6FF; }
    .gar-cell  { aspect-ratio: 1; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border: 2px solid rgba(95,135,161,.22); box-shadow: 0 3px 10px rgba(95,135,161,.12); overflow:hidden; }
    .gar-cell.owned  { aspect-ratio: auto; min-height: 136px; padding: 10px 8px 8px; background: #fff; border-color: rgba(95,135,161,.38); cursor: pointer; }
    .gar-cell.owned:active { opacity: .8; }
    .gar-cell.locked { filter: grayscale(1); opacity: .38; }
    .gar-cell .ce { font-size: 28px; }
    .gar-cell .cn { font-size: 11px; color: #52656E; margin-top: 4px; text-align: center; line-height: 1.2; font-weight: bold; }
    .gar-cell-svg { width: 100%; height: 74px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .gar-cell-svg svg { width:92%; height:100%; display:block; }
    .gar-cell .bldg { font-size: 22px; margin-top: 2px; }
    .gar-cell .bldg { width:28px; height:28px; display:block; margin:2px auto 0; }
    .gar-cell .bldg svg { width:100%; height:100%; display:block; }
    .gar-foot { padding: 16px; background:#EAF6FF; }
    .reset-wrap { position: relative; overflow: hidden; border-radius: 14px; margin-top: 10px; }
    .reset-bar  { position: absolute; bottom: 0; left: 0; height: 3px; width: 0; background: rgba(255,80,80,.7); border-radius: 2px; }
    .reset-bar.go { width: 100%; transition: width 3s linear; }
    .reset-btn  { width: 100%; background: rgba(95,135,161,.12); color: rgba(38,50,56,.45); border: none; border-radius: 14px; font-family: inherit; font-size: 13px; padding: 14px; cursor: pointer; }
    .share-note { grid-column:1/-1; font-size: 11px; line-height: 1.5; color: rgba(38,50,56,.55); text-align: center; margin-top: -2px; }
    .parent-tools { border-top:1px solid rgba(95,135,161,.22); margin-top:10px; padding-top:14px; }
    .parent-tools-title { font-size:12px; color:rgba(38,50,56,.45); text-align:center; margin-bottom:8px; }

    /* CHECKLIST */
    #screen-checklist { background: #EFF6FF; }
    .cl-head { text-align: center; padding: 20px 16px; }
    .cl-head h1 { font-size: 28px; color: #333; }
    .cl-preview { font-size: 16px; color: #999; margin-top: 6px; }
    .task-list { display: flex; flex-direction: column; gap: 12px; padding: 0 16px; flex: 1; }
    .task-item { background: #fff; border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.07); cursor: pointer; border: 3px solid transparent; transition: background .18s, border-color .18s, transform .08s; user-select: none; }
    .task-item:active { transform: scale(.98); }
    .task-item.done { background: #F0FFF4; border-color: #4CAF50; }
    .t-emoji { font-size: 44px; flex-shrink: 0; }
    .screen h1 .title-icon { width:34px; height:34px; display:inline-block; vertical-align:-7px; margin-right:8px; }
    .screen h1 .title-icon svg { width:100%; height:100%; display:block; }
    .t-name  { font-size: 24px; font-weight: bold; color: #333; flex: 1; }
    .t-check { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #DDD; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: all .18s; flex-shrink: 0; }
    .task-item.done .t-check { background: #4CAF50; border-color: #4CAF50; color: #fff; }
    /* Part preview under each task */
    .t-part { font-size: 11px; color: #aaa; margin-top: 4px; }
    .task-item.done .t-part { color: #4CAF50; }
    .cl-foot { padding: 16px; }
    /* Bonus banner */
    .bonus-banner { margin: 8px 16px 0; background: linear-gradient(90deg,#FF6B35,#FFD700); border-radius: 14px; padding: 10px 16px; text-align: center; font-size: 15px; font-weight: bold; color: #fff; transition: opacity .3s; }
    .bonus-banner.hidden { opacity: .35; }

    /* PARENT */
    #screen-parent { background: #0F0F2A; color: #fff; padding: 24px 18px; }
    .par-hero  { text-align: center; margin-bottom: 24px; }
    .par-icon  { font-size: 64px; }
    .par-title { font-size: 24px; color: #FFE66D; margin-top: 8px; font-weight: bold; }
    .par-sub   { font-size: 15px; color: rgba(255,255,255,.45); margin-top: 6px; }
    .par-list  { background: rgba(255,255,255,.08); border-radius: 20px; padding: 6px 20px; margin-bottom: 24px; flex: 1; }
    .par-row   { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
    .par-row:last-child { border: none; }
    .par-lbl   { flex: 1; font-size: 18px; }
    .par-part  { font-size: 12px; color: rgba(255,255,255,.4); margin-top: 2px; }
    .par-bonus { background: rgba(255,215,0,.15); border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; text-align: center; font-size: 15px; color: #FFD700; font-weight: bold; }

    /* PART GAIN */
    #screen-part-gain { background: linear-gradient(155deg,#0D0020,#1a0044); color: #fff; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .pg-svg-wrap { width: 220px; height: 165px; }
    .pg-label { font-size: 15px; color: rgba(255,255,255,.42); letter-spacing: .14em; margin-top: 16px; }
    .pg-name  { font-size: 34px; font-weight: bold; color: #FFE66D; margin: 10px 0 4px; }
    .pg-special { font-size: 34px; font-weight: bold; color: #FFD700; margin: 10px 0 4px; animation: specialGlow 0.8s ease-in-out infinite alternate; }
    @keyframes specialGlow { from{text-shadow:0 0 10px #FFD700} to{text-shadow:0 0 30px #FFD700, 0 0 60px #FF6B35} }
    .pg-dots  { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
    .pg-dot   { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.13); border: 2px solid rgba(255,255,255,.2); }
    .pg-dot.on    { background: #FF6B35; border-color: #FF6B35; }
    .pg-dot.bonus { background: #FFD700; border-color: #FFD700; box-shadow: 0 0 8px #FFD700; }
    @keyframes partSnap { 0%{opacity:0;transform:translateY(-28px) scale(.75)} 100%{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes fadeUp   { from{transform:translateY(14px);opacity:0} to{transform:translateY(0);opacity:1} }
    .fadeup { animation: fadeUp .38s ease both; animation-delay: .2s; opacity: 0; }

    /* CAR COMPLETE */
    #screen-car-complete { background: linear-gradient(148deg,#FF6B35,#FFE66D); color: #fff; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .cc-svg   { width: 240px; height: 180px; }
    .cc-title { font-size: 36px; font-weight: bold; text-shadow: 0 2px 8px rgba(0,0,0,.14); margin-top: 12px; }
    .cc-sub   { font-size: 18px; color: rgba(255,255,255,.8); margin-top: 8px; margin-bottom: 36px; }
    @keyframes wobble { 0%,100%{transform:rotate(-7deg) scale(1.05)} 50%{transform:rotate(7deg) scale(1.05)} }
    .wobble { animation: wobble .45s ease-in-out infinite; }

    /* SHARED */
    .btn { border: none; border-radius: 22px; font-family: inherit; font-weight: bold; cursor: pointer; width: 100%; transition: transform .08s, opacity .08s; }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .42; pointer-events: none; }
    .btn-orange { background: #FF6B35; color: #fff; font-size: 24px; padding: 20px 24px; box-shadow: 0 4px 14px rgba(255,107,53,.45); }
    .btn-green  { background: #4CAF50; color: #fff; font-size: 24px; padding: 20px 24px; box-shadow: 0 4px 14px rgba(76,175,80,.45); }
    .btn-ghost  { background: rgba(0,0,0,.07); color: #666; font-size: 18px; padding: 16px 24px; margin-top: 12px; }
    .btn-ghostw { background: rgba(255,255,255,.16); color: #fff; font-size: 18px; padding: 16px 24px; margin-top: 12px; }
    .sp { flex: 1; }
    .p16 { padding: 0 16px 16px; }
    .spark { position: fixed; pointer-events: none; z-index: 9999; animation: spFade .65s ease forwards; }
    @keyframes spFade { 0%{opacity:1;transform:scale(.3) translateY(0)} 100%{opacity:0;transform:scale(1.2) translateY(-28px)} }

    /* PARTS PREVIEW */
    .parts-preview { display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:8px 12px; background:rgba(255,255,255,.09); border-radius:16px; }
    .parts-car-svg { width:88px; height:66px; flex-shrink:0; }
    .parts-info { flex:1; min-width:0; }
    .parts-car-name { font-size:13px; font-weight:bold; color:#fff; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .parts-dots-row { display:flex; gap:7px; }
    .pd-dot { width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.2); transition:background .3s,border-color .3s; }
    .pd-dot.on    { background:#FF6B35; border-color:#FF6B35; }
    .pd-dot.bonus { background:#FFD700; border-color:#FFD700; box-shadow:0 0 6px #FFD700; }
    .nearby-panel { margin-top:10px; padding:9px; border-radius:16px; background:rgba(255,255,255,.88); box-shadow:0 2px 8px rgba(0,0,0,.12); color:#2F3A3D; }
    .nearby-title { font-size:12px; font-weight:bold; color:#5F87A1; margin:0 2px 7px; }
    .nearby-list { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
    .nearby-card { flex:0 0 92px; min-height:82px; border:0; border-radius:12px; background:#F7FBFF; box-shadow:inset 0 0 0 2px rgba(95,135,161,.12); padding:7px 6px; font-family:inherit; color:#2F3A3D; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
    .nearby-card:active { transform:scale(.96); }
    .nearby-card-icon { width:34px; height:34px; display:block; }
    .nearby-card-icon svg { width:100%; height:100%; display:block; }
    .nearby-card-label { font-size:10px; font-weight:bold; line-height:1.15; text-align:center; }
    .nearby-card-need { font-size:9px; color:#5F87A1; font-weight:bold; }

    /* TOWN BUILDING */
    .map-building { position:absolute; width:62px; height:62px; z-index:3; pointer-events:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
    .map-building svg { width:100%; height:100%; display:block; }
    .inline-svg-icon { width:1.25em; height:1.25em; display:inline-block; vertical-align:-.25em; margin-right:.22em; }
    .inline-svg-icon svg { width:100%; height:100%; display:block; }
    .town-issue { position:absolute; z-index:12; cursor:pointer; text-align:center; transform:translateX(-50%); animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
    .town-issue:active { transform:translateX(-50%) scale(.92); }
    .town-issue.repair-ready { z-index:82; }
    .town-issue.repair-ready::before { content:''; position:absolute; left:50%; top:21px; width:72px; height:72px; border:5px solid #FFE66D; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 8px rgba(255,230,109,.22),0 0 22px rgba(255,230,109,.8); animation:eventRing 1s ease-in-out infinite; pointer-events:none; }
    .town-issue.repair-ready::after { content:'なおせる'; position:absolute; left:50%; top:-25px; transform:translateX(-50%); background:#FFE66D; color:#263238; border:3px solid #fff; border-radius:999px; padding:2px 10px; font-size:13px; font-weight:bold; white-space:nowrap; box-shadow:0 2px 7px rgba(0,0,0,.25); pointer-events:none; }
    .town-issue-icon { font-size:38px; line-height:1; display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
    .town-issue-icon svg { width:42px; height:42px; display:block; }
    .town-issue-label { display:none; }
    .construction-puff { position:absolute; z-index:88; pointer-events:none; transform:translate(-50%,-50%); }
    .construction-puff svg { width:54px; height:54px; display:block; filter:drop-shadow(0 3px 6px rgba(0,0,0,.25)); animation:puffPop 1s ease forwards; }
    .construction-car { position:absolute; z-index:87; width:72px; height:54px; pointer-events:none; filter:drop-shadow(0 4px 8px rgba(0,0,0,.28)); animation:workCarArrive 1.2s ease both; }
    .construction-car svg { width:100%; height:100%; display:block; }
    .completion-card { position:fixed; left:12px; right:12px; top:calc(82px + env(safe-area-inset-top)); z-index:110; display:flex; align-items:center; gap:12px; padding:16px; border-radius:20px; background:#FFF7CC; border:5px solid #FFE66D; color:#263238; box-shadow:0 8px 22px rgba(0,0,0,.28); animation:slideInRight .35s ease both; }
    .completion-icon { width:66px; height:66px; flex:0 0 auto; }
    .completion-icon svg { width:100%; height:100%; display:block; }
    .completion-title { font-size:24px; font-weight:bold; line-height:1.2; }
    .completion-body { font-size:15px; font-weight:bold; color:#5C5142; margin-top:3px; }
    .completion-reveal-building { position:absolute; z-index:92; width:92px; height:92px; transform:translate(-50%,-50%); pointer-events:none; filter:drop-shadow(0 7px 11px rgba(0,0,0,.35)); animation:buildingReveal 1.2s cubic-bezier(.34,1.56,.64,1) both; }
    .completion-reveal-building svg { width:100%; height:100%; display:block; }
    .completion-yatta { position:absolute; z-index:96; transform:translate(-50%,-50%); background:#FFE66D; color:#263238; border:4px solid #fff; border-radius:999px; padding:4px 14px; font-size:18px; font-weight:bold; white-space:nowrap; box-shadow:0 4px 12px rgba(0,0,0,.24); animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both; pointer-events:none; }
    .completion-resident { animation:happyBounce .8s ease-in-out 4; }

    /* EVENT SVG */
    .event-svg-wrap { width:64px; height:64px; display:block; animation:firePulse .5s ease-in-out infinite; filter:drop-shadow(0 3px 8px rgba(0,0,0,.35)); }
    .event-svg-wrap svg { width:100%; height:100%; display:block; }
    .preview-svg-wrap { width:46px; height:46px; display:block; filter:grayscale(.3) brightness(.8); }
    .preview-svg-wrap svg { width:100%; height:100%; display:block; }
    .popup-svg-wrap { width:82px; height:82px; margin:0 auto 8px; }
    .popup-svg-wrap svg { width:100%; height:100%; display:block; }
    .event-anim-svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 5px rgba(0,0,0,.25)); }

    @media (max-width: 430px) {
      .map-topbar { padding: calc(10px + env(safe-area-inset-top)) 10px 10px; gap: 8px; }
      .tb-car { font-size: 17px; }
      .tb-pts { font-size: 12px; }
      .tb-garage { width: 48px; height: 44px; }
      .tb-garage::before { font-size: 22px; }
      .map-hero { padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); }
      .hero-btn { border-radius: 22px; font-size: 26px; padding: 22px 16px; }
      .parts-preview { gap: 8px; padding: 7px 10px; }
      .parts-car-svg { width: 78px; height: 58px; }
      .parts-car-name { font-size: 12px; }
      .gar-grid { gap: 9px; padding: 12px; }
      .gar-cell.owned { min-height: 118px; }
      .task-list { gap: 10px; padding: 0 12px; }
      .task-item { gap: 12px; padding: 16px 14px; border-radius: 18px; }
      .t-emoji { font-size: 38px; }
      .t-name { font-size: 21px; line-height: 1.2; min-width: 0; }
      .t-check { width: 38px; height: 38px; font-size: 22px; }
      .cl-foot, .gar-foot, .p16 { padding-left: 12px; padding-right: 12px; }
      .btn-orange, .btn-green { font-size: 22px; padding: 18px 20px; }
      .popup-overlay { padding: 18px; }
      .popup-box { border-radius: 22px; padding: 24px 20px; }
    }

    @media (max-width: 340px) {
      .tb-garage { font-size: 14px; padding: 8px 9px; }
      .hero-btn { font-size: 23px; padding: 20px 12px; }
      .parts-car-svg { width: 68px; height: 52px; }
      .pd-dot { width: 11px; height: 11px; }
      .t-name { font-size: 19px; }
      .task-item { gap: 10px; padding: 14px 12px; }
    }
    /* Phaser town canvas (v6) */
    #phaser-town { flex: 1; position: relative; overflow: hidden; min-height: 0; }
    #phaser-town canvas { display: block; }

    /* QUEST CARD（きょうのおねがい） */
    .quest-card { margin-top: 10px; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.14); color: #2F3A3D; }
    .quest-card.hidden { display: none; }
    .quest-card.done { background: #F0FFF4; box-shadow: inset 0 0 0 3px #4CAF50; }
    .quest-icon { width: 38px; height: 46px; flex: 0 0 auto; }
    .quest-icon svg { width: 100%; height: 100%; display: block; }
    .quest-text { flex: 1; min-width: 0; font-size: 14px; font-weight: bold; line-height: 1.35; }
    .quest-check { width: 30px; height: 30px; border-radius: 50%; background: #4CAF50; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; flex: 0 0 auto; }
    .quest-check.hidden { display: none; }

    /* STAMP CARD（がんばりカード） */
    .stamp-box { background: #FFF7E6; color: #5C4A2E; }
    .stamp-title { font-size: 24px; font-weight: bold; color: #E07B2A; margin-bottom: 6px; }
    .stamp-streak { font-size: 17px; font-weight: bold; color: #5C4A2E; margin-bottom: 4px; }
    .stamp-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin: 12px 0 10px; }
    .stamp-cell { aspect-ratio: 1; border-radius: 50%; background: rgba(224,123,42,.12); display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(92,74,46,.55); font-weight: bold; }
    .stamp-cell.on { background: #FFE66D; font-size: 17px; }
    .stamp-cell.today { background: #FFD65C; font-size: 19px; box-shadow: 0 0 14px rgba(255,214,92,.95); animation: stampPop .55s cubic-bezier(.34,1.56,.64,1) both; animation-delay: .45s; }
    @keyframes stampPop { 0%{transform:scale(0)} 70%{transform:scale(1.45)} 100%{transform:scale(1)} }
    .stamp-reward { font-size: 14px; font-weight: bold; color: #A5814F; }
  </style>
</head>
<body>

<!-- MAP -->
<div class="screen" id="screen-map">
  <div class="map-topbar">
    <div class="tb-info">
      <div class="tb-car" id="tb-car"></div>
      <div class="tb-pts" id="tb-pts"></div>
    </div>
    <button class="tb-garage" onclick="openGarage()" aria-label="ガレージ">
      <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 38 L40 14 L70 38" fill="none" stroke="#2F3A3D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 36 L40 18 L63 36 V68 H17 Z" fill="#FFE0B2" stroke="#2F3A3D" stroke-width="4" stroke-linejoin="round"/><rect x="29" y="45" width="22" height="23" rx="4" fill="#5F87A1" stroke="#2F3A3D" stroke-width="4"/><rect x="24" y="38" width="12" height="10" rx="2" fill="#A7D7F9" stroke="#2F3A3D" stroke-width="3"/><rect x="44" y="38" width="12" height="10" rx="2" fill="#A7D7F9" stroke="#2F3A3D" stroke-width="3"/><path d="M18 66 H62" stroke="#2F3A3D" stroke-width="4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="map-hero">
    <button class="sound-unlock" id="sound-unlock" onclick="unlockSound()">おとをオン</button>
    <div class="parts-preview" id="map-parts-preview">
      <div class="parts-car-svg" id="map-car-svg"></div>
      <div class="parts-info">
        <div class="parts-car-name" id="parts-car-name"></div>
        <div class="parts-dots-row" id="parts-dots-row"></div>
      </div>
    </div>
    <button class="hero-btn orange" id="hero-btn" onclick="heroAction()"></button>
    <div class="event-guide-card hidden" id="event-guide-card" onclick="heroAction()">
      <div class="event-guide-icon" id="event-guide-icon"></div>
      <div class="event-guide-copy">
        <div class="event-guide-title" id="event-guide-title"></div>
        <div class="event-guide-body" id="event-guide-body"></div>
      </div>
    </div>
    <div class="quest-card hidden" id="quest-card">
      <div class="quest-icon" id="quest-icon"></div>
      <div class="quest-text" id="quest-text"></div>
      <div class="quest-check hidden" id="quest-check">✓</div>
    </div>
    <div class="nearby-panel hidden" id="nearby-panel">
      <div class="nearby-title">おこっていること</div>
      <div class="nearby-list" id="nearby-list"></div>
    </div>
  </div>
  <div id="phaser-town"></div>
</div>

<!-- STAMP CARD -->
<div class="popup-overlay hidden" id="stamp-popup">
  <div class="popup-box stamp-box">
    <div class="stamp-title">⭐ がんばりカード ⭐</div>
    <div class="stamp-streak" id="stamp-streak"></div>
    <div class="stamp-grid" id="stamp-grid"></div>
    <div class="stamp-reward" id="stamp-reward"></div>
  </div>
</div>

<!-- GARAGE -->
<div class="screen" id="screen-garage">
  <div class="gar-head">
    <div class="gar-title"><span class="inline-svg-icon"><svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 38 L40 14 L70 38" fill="none" stroke="#2F3A3D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 36 L40 18 L63 36 V68 H17 Z" fill="#FFE0B2" stroke="#2F3A3D" stroke-width="4" stroke-linejoin="round"/><rect x="29" y="45" width="22" height="23" rx="4" fill="#5F87A1" stroke="#2F3A3D" stroke-width="4"/><rect x="24" y="38" width="12" height="10" rx="2" fill="#A7D7F9" stroke="#2F3A3D" stroke-width="3"/><rect x="44" y="38" width="12" height="10" rx="2" fill="#A7D7F9" stroke="#2F3A3D" stroke-width="3"/></svg></span>ガレージ</div>
    <div class="gar-sub" id="gar-sub"></div>
  </div>
  <div class="gar-actions">
    <button class="btn btn-ghost" onclick="showMap()">もどる</button>
    <button class="btn btn-ghostw" onclick="copyShareUrl()">🔗 記録URLをコピー</button>
    <div class="share-note">別のブラウザで同じ記録を開くときだけ使います</div>
  </div>
  <div class="gar-tabs">
    <button class="gar-tab active" data-tab="cars" onclick="setGarTab('cars')">くるま</button>
    <button class="gar-tab" data-tab="residents" onclick="setGarTab('residents')">じゅうにん</button>
    <button class="gar-tab" data-tab="buildings" onclick="setGarTab('buildings')">たてもの</button>
  </div>
  <div class="gar-grid" id="gar-grid"></div>
  <div class="gar-foot">
    <div class="parent-tools">
      <div class="parent-tools-title">── テスト用 ──</div>
      <button class="btn" onclick="testNextDay()" style="background:rgba(255,200,0,.15);color:rgba(255,220,80,.8);font-size:15px;padding:13px;margin-bottom:8px;">⏭ きょうをリセット</button>
      <button class="btn" onclick="testSkipCar()" style="background:rgba(0,200,100,.12);color:rgba(80,220,140,.8);font-size:15px;padding:13px;margin-bottom:10px;">⚡ いまのくるまをかんせいにする</button>
    </div>
    <div class="reset-wrap">
      <div class="reset-bar" id="reset-bar"></div>
      <button class="reset-btn" onpointerdown="startReset()" onpointerup="cancelReset()" onpointerleave="cancelReset()">
        🔄 さいしょからやりなおす（3びょうおしつづける）
      </button>
    </div>
  </div>
</div>

<!-- PREVIEW POPUP -->
<div class="popup-overlay hidden" id="preview-popup">
  <div class="popup-box">
    <div class="popup-obstacle" id="pp-obstacle"></div>
    <div class="popup-title"   id="pp-title"></div>
    <div class="popup-body"    id="pp-body"></div>
    <div class="popup-progress" id="pp-progress"></div>
    <button class="btn btn-orange" onclick="document.getElementById('preview-popup').classList.add('hidden')">わかった！⚡</button>
  </div>
</div>

<!-- CAR DETAIL POPUP -->
<div class="popup-overlay hidden" id="car-detail-popup">
  <div class="popup-box">
    <div class="popup-obstacle" id="cdp-bldg"></div>
    <div style="width:170px;height:128px;margin:0 auto 8px;" id="cdp-svg"></div>
    <div class="popup-title" id="cdp-title"></div>
    <div class="popup-body" id="cdp-body"></div>
    <button class="btn btn-orange" onclick="document.getElementById('car-detail-popup').classList.add('hidden')">とじる</button>
  </div>
</div>

<!-- CHECKLIST -->
<div class="screen" id="screen-checklist">
  <div class="cl-head">
    <h1><span class="title-icon"><svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="40" cy="40" r="31" fill="#74B86F" stroke="#2F3A3D" stroke-width="4"/><path d="M24 41 L35 52 L58 27" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 24 Q34 13 51 19" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="5" stroke-linecap="round"/></svg></span>きょうのしたく</h1>
    <div class="cl-preview" id="cl-preview"></div>
  </div>
  <div class="bonus-banner hidden" id="bonus-banner">⭐ ぜんぶできたら Special パーツももらえる！</div>
  <div class="task-list" id="task-list"></div>
  <div class="cl-foot">
    <button class="btn btn-orange" id="btn-done" onclick="openParent()" disabled>できた！🎉</button>
    <button class="btn btn-ghost" onclick="showMap()">もどる</button>
  </div>
</div>

<!-- PARENT -->
<div class="screen" id="screen-parent">
  <div class="par-hero">
    <div class="par-icon">👨‍👩‍👦</div>
    <div class="par-title">おかあさん・おとうさんへ</div>
    <div class="par-sub">したことをかくにんしてね</div>
  </div>
  <div class="par-list" id="par-list"></div>
  <div class="par-bonus hidden" id="par-bonus">⭐ ぜんぶできた！Special パーツボーナス！</div>
  <button class="btn btn-green" onclick="approve()">✓ かくにんした！</button>
  <button class="btn btn-ghostw" onclick="showScreen('screen-checklist')">もどる</button>
</div>

<!-- PART GAIN -->
<div class="screen" id="screen-part-gain">
  <div class="sp"></div>
  <div class="pg-svg-wrap" id="pg-svg"></div>
  <div class="pg-label fadeup" id="pg-label">パーツゲット！</div>
  <div id="pg-name-wrap"><div class="pg-name fadeup" id="pg-name"></div></div>
  <div class="pg-dots" id="pg-dots"></div>
  <div class="sp"></div>
</div>

<!-- CAR COMPLETE -->
<div class="screen" id="screen-car-complete">
  <div class="sp"></div>
  <div class="wobble"><div class="cc-svg" id="cc-svg"></div></div>
  <div class="cc-title" id="cc-title"></div>
  <div class="cc-sub">ガレージにとうろくされたよ！</div>
  <div class="sp"></div>
  <div class="p16">
    <button class="btn" style="background:#fff;color:#FF6B35;font-size:22px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.14);" onclick="showMap()">
      🗺️ マップへ！
    </button>
  </div>
</div>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
